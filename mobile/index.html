<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>rhytm... thing..</title>
</head>
<body>
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;">hi</h2>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #game-wrap { display: flex; flex-direction: column; align-items: center; background: #111; border-radius: 12px; padding: 12px 0 14px; width: 100%; }
  #hud { display: flex; gap: 0; width: 100%; max-width: 420px; margin-bottom: 10px; }
  .stat { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 11px; color: #666; letter-spacing: 0.05em; }
  .stat-val { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.2; }
  #board-outer { width: 100%; max-width: 420px; padding: 0 8px; }
  #board-wrap {
     width: 100vw;
  height: 100dvh;
  max-width: 100%;
  max-height: 100%;
  border-radius: 0;
  }
  .lane-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #1a1a1a; z-index: 1; }
  #hit-zone { position: absolute; left: 0; right: 0; border-top: 1.5px solid #378ADD; border-bottom: 1.5px solid #378ADD; background: rgba(55,138,221,0.07); pointer-events: none; z-index: 2; }
  .lane-btn { position: absolute; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #444; cursor: pointer; user-select: none; border-top: 1px solid #1a1a1a; transition: background 0.08s; z-index: 4; }
  .lane-btn.flash { background: rgba(255,255,255,0.12); color: #fff; }
  .tile { position: absolute; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; user-select: none; z-index: 3; }
  .tile.hit { background: #378ADD !important; }
  .tile.miss { opacity: 0.4; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; background: rgba(0,0,0,0.93); border-radius: 12px; }
  #overlay h3 { font-size: 26px; font-weight: 700; color: #fff; }
  #overlay p { font-size: 14px; color: #888; text-align: center; max-width: 240px; line-height: 1.6; }
  #overlay button { font-size: 16px; font-weight: 700; padding: 12px 36px; cursor: pointer; border-radius: 8px; border: none; background: #fff; color: #000; }
  .feedback { position: absolute; font-size: 13px; font-weight: 700; pointer-events: none; z-index: 6; animation: pop 0.5s ease forwards; }
  @keyframes pop { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-24px)} }
  #bottom-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #bottom-bar label { font-size: 12px; color: #666; }
  #speed-sel { font-size: 13px; background: #222; color: #fff; border: 1px solid #333; padding: 5px 10px; border-radius: 6px; }
</style>

<div id="game-wrap">
  <div id="hud">
    <div class="stat"><span class="stat-label">score</span><span class="stat-val" id="score-el">0</span></div>
    <div class="stat"><span class="stat-label">comb-oes</span><span class="stat-val" id="combo-el">0x</span></div>
    <div class="stat"><span class="stat-label">how to survive</span><span class="stat-val" id="lives-el">3</span></div>
  </div>
  <div id="board-outer">
    <div id="board-wrap">
      <div id="hit-zone"></div>
      <div id="board"></div>
      <div id="overlay">
        <h3>tiles, that goes down</h3>
        <p>wdym u dont know how to play</p>
        <p>for inquiries: samkanzmakh@gmail.com</p>
        <button id="start-btn">im here</button>
        <a href="../index.html">
          <button>Go to IDK</button>
        </a>
      </div>
    </div>
  </div>
  <div id="bottom-bar">
    <label>speed</label>
    <select id="speed-sel">
      <option value="1.5">suppa noob</option>
      <option value="2.5" selected>mega noob</option>
      <option value="4">mid</option>
      <option value="6">okay</option>
    </select>
  </div>
</div>

<script>
const hitSounds = [
  new Audio('sounds/great.mp3'),
  new Audio('sounds/better.mp3'),
  new Audio('sounds/somehow.mp3'),
  new Audio('sounds/nice.mp3'),
];
const missSound = new Audio('sounds/miss.mp3');
const LANES = 4;
const laneColors = ['#378ADD','#1D9E75','#D85A30','#D4537E'];
const laneDecals = ['▲','▲','▲','▲'];
const laneKeys = ['a','s','d','f'];
const noteFreqs = [261.63, 293.66, 329.63, 349.23];

let actx, tiles, score, combo, lives, spawnTimer, gameRunning, animId, lastTime;
let BW, BH, LANE_W, TILE_W, TILE_H, HIT_TOP, HIT_BOT, BTN_H;

const boardWrap = document.getElementById('board-wrap');
const board = document.getElementById('board');
const scoreEl = document.getElementById('score-el');
const comboEl = document.getElementById('combo-el');
const livesEl = document.getElementById('lives-el');
const overlay = document.getElementById('overlay');
const speedSel = document.getElementById('speed-sel');
const hitZone = document.getElementById('hit-zone');

function measure() {
  BW = boardWrap.clientWidth;
  BH = boardWrap.clientHeight;
  LANE_W = BW / LANES;
  TILE_W = Math.floor(LANE_W) - 4;
  TILE_H = Math.round(BH * 0.16);
  BTN_H = Math.round(BH * 0.13);
  HIT_TOP = BH - BTN_H - Math.round(BH * 0.13);
  HIT_BOT = BH - BTN_H;
  hitZone.style.bottom = BTN_H + 'px';
  hitZone.style.height = Math.round(BH * 0.13) + 'px';
}

function buildBoard() {
  measure();
  board.innerHTML = '';
  for (let i = 1; i < LANES; i++) {
    const line = document.createElement('div');
    line.className = 'lane-line';
    line.style.left = (i * LANE_W) + 'px';
    board.appendChild(line);
  }
  for (let i = 0; i < LANES; i++) {
    const btn = document.createElement('div');
    btn.className = 'lane-btn';
    btn.style.cssText = `left:${i*LANE_W+2}px;width:${LANE_W-4}px;height:${BTN_H}px;bottom:0;`;
    btn.textContent = laneKeys[i].toUpperCase();
    btn.dataset.lane = i;
    btn.addEventListener('mousedown', () => pressLane(i));
    btn.addEventListener('touchstart', e => { e.preventDefault(); pressLane(i); }, { passive: false });
    board.appendChild(btn);
  }
}

function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(lane, type) {
  if (type === 'miss') {
    missSound.currentTime = 0;
    missSound.play();
  } else {
    hitSounds[lane].currentTime = 0;
    hitSounds[lane].play();
  }
}

function spawnTile() {
  const lane = Math.floor(Math.random() * LANES);
  const el = document.createElement('div');
  el.className = 'tile';
  el.style.cssText = `width:${TILE_W}px;height:${TILE_H}px;left:${lane*LANE_W+2}px;top:-${TILE_H}px;background:${laneColors[lane]};color:#fff;`;
  el.textContent = laneDecals[lane];
  const tile = { lane, el, y: -TILE_H, hit: false, missed: false };
  el.addEventListener('mousedown', () => hitTileEl(tile));
  el.addEventListener('touchstart', e => { e.preventDefault(); hitTileEl(tile); }, { passive: false });
  board.appendChild(el);
  tiles.push(tile);
}

function hitTileEl(tile) {
  if (tile.hit || tile.missed) return;
  if (tile.y + TILE_H >= HIT_TOP - 5 && tile.y <= HIT_BOT + 15) doHit(tile);
}

function pressLane(lane) {
  initAudio();
  const btn = board.querySelector(`.lane-btn[data-lane="${lane}"]`);
  if (btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 130); }
  const inZone = tiles.filter(t =>
    t.lane === lane && !t.hit && !t.missed &&
    t.y + TILE_H >= HIT_TOP - 15 && t.y <= HIT_BOT + 15
  );
  if (inZone.length) { inZone.sort((a,b) => b.y - a.y); doHit(inZone[0]); }
}

function doHit(tile) {
  tile.hit = true;
  tile.el.classList.add('hit');
  combo++; score += 10 * combo;
  scoreEl.textContent = score;
  comboEl.textContent = combo + 'x';
  playNote(tile.lane, 'hit');
  showFeedback(tile.lane, combo >= 10 ? 'amazing!' : combo >= 5 ? 'perfect!' : 'nice', laneColors[tile.lane]);
  setTimeout(() => { if (tile.el.parentNode) tile.el.remove(); }, 150);
}

function doMiss(tile) {
  tile.missed = true;
  tile.el.classList.add('miss');
  combo = 0; comboEl.textContent = '0x';
  lives--; livesEl.textContent = lives;
  playNote(tile.lane, 'miss');
  showFeedback(tile.lane, 'miss', '#E24B4A');
  setTimeout(() => { if (tile.el.parentNode) tile.el.remove(); }, 300);
  if (lives <= 0) endGame();
}

function showFeedback(lane, text, color) {
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.style.cssText = `color:${color};left:${lane*LANE_W+6}px;bottom:${BTN_H+10}px;`;
  fb.textContent = text;
  board.appendChild(fb);
  setTimeout(() => { if (fb.parentNode) fb.remove(); }, 500);
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  overlay.style.display = 'flex';
  overlay.innerHTML = `<h3>game over</h3><p>score: ${score}</p><button id="start-btn">play again</button>`;
  document.getElementById('start-btn').addEventListener('click', startGame);
}

function startGame() {
  initAudio();
  buildBoard();
  tiles = []; score = 0; combo = 0; lives = 3;
  scoreEl.textContent = '0'; comboEl.textContent = '0x'; livesEl.textContent = '3';
  overlay.style.display = 'none';
  board.querySelectorAll('.tile,.feedback').forEach(e => e.remove());
  lastTime = null; spawnTimer = 0; gameRunning = true;
  animId = requestAnimationFrame(loop);
}

function loop(ts) {
  if (!gameRunning) return;
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  const speed = parseFloat(speedSel.value);
  const spawnInterval = Math.max(350, 1400 - speed * 100);
  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) { spawnTile(); spawnTimer = 0; }
  const pxPerMs = speed * 0.12 * (BH / 480);
  for (let i = tiles.length - 1; i >= 0; i--) {
    const t = tiles[i];
    if (t.hit || t.missed) { tiles.splice(i,1); continue; }
    t.y += pxPerMs * dt;
    t.el.style.top = t.y + 'px';
    if (t.y > HIT_BOT + 15) doMiss(t);
  }
  if (gameRunning) animId = requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { if (gameRunning) { measure(); } else { buildBoard(); } });

buildBoard();
document.getElementById('start-btn').addEventListener('click', startGame);
document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  const i = laneKeys.indexOf(e.key.toLowerCase());
  if (i >= 0) pressLane(i);
});
</script>
</body>
</html>
